name: Build & Release (Windows x64)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache CMake/Ninja build directory
        uses: actions/cache@v4
        with:
          path: build
          key: win-x64-build-${{ hashFiles('CMakeLists.txt', 'runtime/**', 'recompiler/**', 'third_party/imgui/**') }}
          restore-keys: |
            win-x64-build-

      - name: Verify toolchain
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          clang++ --version

      - name: Configure with CMake + Ninja + Clang
        shell: pwsh
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build self-contained recompiler
        shell: pwsh
        run: cmake --build build --parallel

      - name: Package portable single-exe release bundle
        shell: pwsh
        run: |
          $dist = "dist\AriaOfSorrowRecomp-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build\recomp-ariaofsorrow.exe" "$dist\"
          Copy-Item "README.md" "$dist\"
          Copy-Item "LICENSE" "$dist\"
          Compress-Archive -Path "$dist\*" -DestinationPath "dist\AriaOfSorrowRecomp-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AriaOfSorrowRecomp-windows-x64
          path: dist/AriaOfSorrowRecomp-windows-x64.zip

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AriaOfSorrowRecomp-windows-x64.zip
          generate_release_notes: true
