<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Castlevania: Aria of Sorrow - WebAssembly Static Recomp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0a090d;
      color: #e4e0e8;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #canvas-wrap {
      width: 100%; height: calc(100% - 36px);
      display: flex; align-items: center; justify-content: center;
    }
    canvas#canvas {
      max-width: 100%; max-height: 100%;
      background: #000;
      outline: none;
    }
    #bar {
      width: 100%; height: 36px;
      background: #17121c;
      border-top: 1px solid #3a1a24;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; font-size: 13px;
    }
    button {
      background: #6b1d2b; color: #fff; border: none; border-radius: 4px;
      padding: 5px 12px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #8f2639; }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  </div>
  <div id="bar">
    <span>Castlevania: Aria of Sorrow [WebAssembly Recomp] &mdash; Press <b>F10</b> for ImGui Settings &amp; Binds</span>
    <button onclick="document.getElementById('canvas').requestFullscreen()">Fullscreen</button>
  </div>
  <script>
    var Module = {
      canvas: (function() { return document.getElementById('canvas'); })(),
      print: function(t) { console.log(t); },
      printErr: function(t) { console.error(t); }
    };
    window.addEventListener('keydown', function(e) {
      if (['F10', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.key)) {
        e.preventDefault();
      }
    }, false);
  </script>
  {{{ SCRIPT }}}
</body>
</html>
